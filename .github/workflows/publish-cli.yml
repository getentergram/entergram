name: Publish CLI to npm

# Publishes cli/ to npm when a change to it lands on main. The publish step is
# version-guarded: npm rejects re-publishing an existing version, so the job
# checks the registry first and no-ops instead of failing every unrelated merge.
on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".github/workflows/publish-cli.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and test only — do not publish"
        type: boolean
        default: false

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: cli/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: node --test 'test/*.test.js' 'test/runtime/*.test.js'

      - name: Verify the viz UI is in the tarball
        # files[] must include "ui": src/viz/server.js resolves the prebuilt UI at
        # ../../ui, so a tarball without it ships an `entergram viz` that 404s.
        run: |
          count=$(npm pack --dry-run --json | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
               const f=JSON.parse(s)[0].files.map(x=>x.path);
               console.log(f.filter(p=>p.startsWith("ui/")).length);
             })')
          echo "ui/ files in tarball: $count"
          if [ "$count" -eq 0 ]; then
            echo '::error::No ui/ files in the tarball — entergram viz would 404 for installed users.'
            exit 1
          fi

      - name: Is this version already on npm?
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "name=$name"       >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm — nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is new — will publish."
          fi

      - name: Publish
        if: steps.check.outputs.published == 'false' && !inputs.dry_run
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### ${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }}"
            if [ "${{ steps.check.outputs.published }}" = "true" ]; then
              echo "Already on npm — publish skipped."
            elif [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run — built and tested, not published."
            else
              echo "Published to npm."
              echo ""
              echo "Next: update the Homebrew formula checksum —"
              echo '```'
              echo 'curl -sL "$(npm view get-entergram dist.tarball)" | shasum -a 256'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
